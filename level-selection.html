<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/level-selection.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Michroma&display=swap" rel="stylesheet">
    

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="levels">
        <h1>Select Level</h1>
        <div class="level-row">
             <div id="1" class="level">
                <div class="level-bg" style="background-image: url('images/level1.jpg');"></div>
                <span>1</span>
            </div>
            <div id="2" class="level selected">
                <div class="level-bg" style="background-image: url('images/level2.jpg');"></div>
                <span>2</span>
            </div>
            <div id="3" class="level locked">
                <div class="level-bg" style="background-image: url('images/level3.jpg');"></div>
                <span>3</span>
            </div>
            <div id="4" class="level locked">
                <div class="level-bg" style="background-image: url('images/level4.jpg');"></div>
                <span>4</span>
            </div>
        </div>
        <div class="level-row">
            <div id="5" class="level locked">
                <div class="level-bg" style="background-image: url('images/level5.jpg');"></div>
                <span>5</span>
            </div>
            <div id="6" class="level locked">
                <div class="level-bg" style="background-image: url('images/level6.jpg');"></div>
                <span>6</span>
            </div>
            <div id="7" class="level locked">
                <div class="level-bg" style="background-image: url('images/level7.jpg');"></div>
                <span>7</span>
            </div>
            <div id="8" class="level locked">
                <div class="level-bg" style="background-image: url('images/level8.jpg');"></div>
                <span>8</span>
            </div>
        </div>
        <div class="level-row">
            <div id="9" class="level locked">
                <div class="level-bg" style="background-image: url('images/level9.jpg');"></div>
                <span>9</span>
            </div>
            <div id="10" class="level locked">
                <div class="level-bg" style="background-image: url('images/level10.jpg');"></div>
                <span>10</span>
            </div>
            <div id="11" class="level locked">
                <div class="level-bg" style="background-image: url('images/level11.jpg');"></div>
                <span>11</span>
            </div>
            <div id="12" class="level locked">
                <div class="level-bg" style="background-image: url('images/level12.jpg');"></div>
                <span>12</span>
            </div>
        </div>
        <div class="level-row">
            <div id="13" class="level locked">
                <div class="level-bg" style="background-image: url('images/level13.jpg');"></div>
                <span>13</span>
            </div>
            <div id="14" class="level locked">
                <div class="level-bg" style="background-image: url('images/level14.jpg');"></div>
                <span>13</span>
            </div>
            <div id="15" class="level locked">
                <div class="level-bg" style="background-image: url('images/level15.jpg');"></div>
                <span>15</span>
            </div>
            <div id="16" class="level locked">
                <div class="level-bg" style="background-image: url('images/level16.jpg');"></div>
                <span>16</span>
            </div>
        </div>
    </div>

    <script src="scripts/level-selection.js" defer></script>
</body>
</html>
